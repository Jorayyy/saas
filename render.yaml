services:
  - type: web
    name: techshop-api
    runtime: node
    region: oregon
    buildCommand: cd apps/api && npm install --include=dev && npx prisma generate && node -e "try{require('child_process').execSync('npx tsc -p tsconfig.json',{stdio:'inherit'})}catch(e){}"
    startCommand: cd apps/api && npx prisma db push && node dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        value: techshop-secret-key
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
